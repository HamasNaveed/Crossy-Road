<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Hop Rush — Crossy Road Clone</title>
<style>
  :root{
    --sky-top:#8fd3ff;
    --sky-bottom:#cdeeff;
    --ink:#1b2a2f;
    --panel:#ffffffee;
    --accent:#ffb100;
    --accent-2:#ff5d5d;
    --grass:#7ec850;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;width:100%;height:100%;overflow:hidden;
    font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;
    background:linear-gradient(var(--sky-top),var(--sky-bottom));
    touch-action:none;
    user-select:none;
  }
  #canvas-wrap{position:fixed;inset:0;}
  canvas{display:block;width:100%;height:100%;}

  #hud{
    position:fixed;top:0;left:0;right:0;
    display:flex;justify-content:space-between;align-items:flex-start;
    padding:16px 18px;pointer-events:none;z-index:10;
  }
  #score{
    background:var(--panel);
    padding:8px 18px;border-radius:16px;
    font-size:22px;font-weight:800;color:var(--ink);
    box-shadow:0 4px 0 rgba(0,0,0,0.15);
    letter-spacing:1px;
  }
  #best{
    background:var(--panel);
    padding:6px 14px;border-radius:14px;
    font-size:13px;font-weight:700;color:#6b7b80;
    margin-top:6px;
  }
  #title-badge{
    background:var(--accent);
    padding:8px 16px;border-radius:16px;
    font-size:16px;font-weight:800;color:#4a2e00;
    box-shadow:0 4px 0 rgba(0,0,0,0.15);
  }

  #controls{
    position:fixed;bottom:0;left:0;right:0;
    display:flex;justify-content:center;align-items:center;
    padding:20px;pointer-events:none;z-index:10;
  }
  #dpad{
    display:grid;
    grid-template-columns:56px 56px 56px;
    grid-template-rows:56px 56px 56px;
    gap:6px;
    pointer-events:auto;
  }
  #dpad button{
    border:none;border-radius:14px;
    background:var(--panel);
    box-shadow:0 4px 0 rgba(0,0,0,0.2);
    font-size:22px;color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    active-opacity:0.5;
  }
  #dpad button:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,0.2);}
  #btn-up{grid-column:2;grid-row:1;}
  #btn-left{grid-column:1;grid-row:2;}
  #btn-down{grid-column:2;grid-row:2;background:var(--accent);}
  #btn-right{grid-column:3;grid-row:2;}
  #dpad .spacer{visibility:hidden;}

  #overlay{
    position:fixed;inset:0;z-index:20;
    display:flex;align-items:center;justify-content:center;
    background:rgba(20,30,35,0.55);
    backdrop-filter:blur(2px);
  }
  #overlay.hidden{display:none;}
  #panel{
    background:var(--panel);
    border-radius:22px;
    padding:32px 28px;
    width:min(340px,86vw);
    text-align:center;
    box-shadow:0 10px 0 rgba(0,0,0,0.2);
  }
  #panel h1{
    margin:0 0 4px;font-size:30px;color:var(--ink);
    letter-spacing:1px;
  }
  #panel .sub{color:#6b7b80;font-size:14px;margin-bottom:18px;font-weight:600;}
  #panel .stat{font-size:16px;color:var(--ink);margin:4px 0;font-weight:700;}
  #panel .stat span{color:var(--accent-2);font-size:20px;}
  #playBtn{
    margin-top:18px;
    border:none;border-radius:16px;
    background:var(--accent-2);color:#fff;
    font-size:18px;font-weight:800;letter-spacing:1px;
    padding:14px 34px;
    box-shadow:0 5px 0 #b83f3f;
    cursor:pointer;
  }
  #playBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #b83f3f;}
  #hint{margin-top:14px;font-size:12px;color:#8b9a9e;font-weight:600;}

  #char-select {
    display:flex; justify-content:center; align-items:center; margin:16px 0;
  }
  .char-btn {
    background:var(--panel); border:2px solid var(--accent); border-radius:10px;
    width:36px; height:36px; font-size:18px; font-weight:bold; cursor:pointer; color:var(--ink);
  }
  .char-btn:active { background:var(--accent); color:#fff; }
  #char-name { width:120px; font-size:16px; font-weight:800; color:var(--ink); }

  #toast {
    position:fixed; top:70px; left:50%; transform:translateX(-50%);
    background:rgba(20,30,35,0.85); color:#fff; padding:10px 24px; border-radius:20px;
    font-size:15px; font-weight:bold; pointer-events:none; z-index:30;
    opacity:0; transition:opacity 0.3s; box-shadow:0 4px 0 rgba(0,0,0,0.2);
  }
  #toast.visible { opacity:1; }

  #swipe-zone{position:fixed;inset:0;z-index:5;}
</style>
</head>
<body>

<div id="canvas-wrap"><canvas id="c"></canvas></div>
<div id="swipe-zone"></div>
<div id="toast">Weather: Sunny</div>

<div id="hud">
  <div>
    <div id="score">0</div>
    <div id="best">BEST 0</div>
  </div>
  <div id="title-badge">🐔 HOP RUSH</div>
</div>

<div id="controls">
  <div id="dpad">
    <div class="spacer"></div><button id="btn-up">▲</button><div class="spacer"></div>
    <button id="btn-left">◀</button><button id="btn-down">▼</button><button id="btn-right">▶</button>
  </div>
</div>

<div id="overlay">
  <div id="panel">
    <h1>HOP RUSH</h1>
    <div class="sub">a crossy road-style dash</div>
    <div class="stat">Last run: <span id="lastScore">0</span></div>
    <div class="stat">Best: <span id="bestScore">0</span></div>
    
    <div id="char-select">
      <button class="char-btn" id="prevChar">&lt;</button>
      <div id="char-name">Chicken</div>
      <button class="char-btn" id="nextChar">&gt;</button>
    </div>

    <button id="playBtn">PLAY</button>
    <div id="hint">Arrow keys / WASD / swipe / tap the pad<br/>Cross roads, ride logs, don't get squashed 🐸</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  "use strict";

  // ---------- basic setup ----------
  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xcdeeff, 30, 62);

  const VIEW = 12;
  const camera = new THREE.OrthographicCamera(-VIEW, VIEW, VIEW, -VIEW, -50, 100);
  function setCamera(){
    const aspect = window.innerWidth/window.innerHeight;
    const w = VIEW, h = VIEW/aspect;
    camera.left = -w; camera.right = w; camera.top = h; camera.bottom = -h;
    camera.updateProjectionMatrix();
  }

  const CAM_OFFSET = new THREE.Vector3(-14,14,14);
  camera.position.copy(CAM_OFFSET);
  camera.lookAt(0,0,0);

  // lights
  const hemi = new THREE.HemisphereLight(0xffffff, 0x88aa66, 0.9);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xffffff, 0.9);
  sun.position.set(-30,40,20);
  sun.castShadow = true;
  sun.shadow.camera.left = -30; sun.shadow.camera.right = 30;
  sun.shadow.camera.top = 30; sun.shadow.camera.bottom = -30;
  sun.shadow.camera.near = 1; sun.shadow.camera.far = 100;
  sun.shadow.mapSize.set(2048,2048);
  scene.add(sun);

  function resize(){
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    setCamera();
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- helpers ----------
  const LANE_W = 2; // world units per row (depth)
  const COLS = 17;  // visible columns (x), odd number so center col = 0
  const HALF = Math.floor(COLS/2);

  function box(w,h,d,color){
    const geo = new THREE.BoxGeometry(w,h,d);
    const mat = new THREE.MeshLambertMaterial({color});
    const m = new THREE.Mesh(geo,mat);
    m.castShadow = true; m.receiveShadow = true;
    return m;
  }

  // color palettes
  const GRASS_COLORS = [0x7ec850, 0x74bf49];
  const ROAD_COLOR = 0x4a4a52;
  const WATER_COLOR = 0x4fb3e0;
  const RAIL_COLOR = 0x8a6a4a;

  // ---------- world state ----------
  let rows = [];        // row data by index (index = z step, increasing forward)
  let rowGroups = new Map(); // index -> THREE.Group (visual)
  let vehicles = [];     // active moving objects {mesh, rowIndex, speed, dir, width}
  let player, playerZ=0, playerX=0; // grid coords
  let playerPos = new THREE.Vector3(0,0.5,0); // visual position
  let playerTarget = new THREE.Vector3(0,0.5,0);
  let hopT = 1; // 0..1 hop animation progress (1 = idle)
  let hopFrom = new THREE.Vector3();
  let facing = 0; // radians
  let targetFacing = 0;
  let onLog = null;
  let alive = true;
  let score = 0;
  let best = parseInt(localStorage.getItem('hopRushBest')||'0',10);
  let started = false;
  let riverStreak = 0;

  const worldGroup = new THREE.Group();
  scene.add(worldGroup);

  // ground filler far below to avoid gaps
  const backdrop = box(200,1,200,0x9fdc7a);
  backdrop.position.y = -1.5;
  backdrop.receiveShadow = true;
  scene.add(backdrop);

  function rng(seed){ // deterministic-ish rng not needed; use Math.random
    return Math.random();
  }

  function makeRow(index){
    // decide row type based on index, with grass buffer near start
    let type;
    if(index <= 1){ type = 'grass'; }
    else {
      const r = Math.random();
      // avoid 3 water rows in a row without a break (riverStreak)
      if(riverStreak >= 3){ type = 'grass'; riverStreak=0; }
      else if(r < 0.34){ type='road'; riverStreak=0; }
      else if(r < 0.62){ type='water'; riverStreak++; }
      else { type='grass'; riverStreak=0; }
    }

    const row = {index, type, dir: Math.random()<0.5?1:-1, speed: 0.035+Math.random()*0.05, occupied:new Set()};
    const group = new THREE.Group();
    group.position.z = -index*LANE_W;

    if(type==='grass'){
      const g = box(COLS*LANE_W+LANE_W, 1, LANE_W, GRASS_COLORS[index%2]);
      g.position.y = -0.5;
      group.add(g);
      // occasional decorative tree/rock (avoid center column start rows)
      if(index>1 && Math.random()<0.35){
        const tx = (Math.floor(Math.random()*COLS)-HALF);
        const trunk = box(0.3,0.6,0.3,0x8a5a3a);
        trunk.position.set(tx*LANE_W,0.3,0);
        const leaves = box(1.1,1.1,1.1,0x3f9e4d);
        leaves.position.set(tx*LANE_W,1.05,0);
        group.add(trunk,leaves);
        row.occupied.add(tx); // block that tile
      }
    } else if(type==='road'){
      const g = box(COLS*LANE_W+LANE_W, 0.9, LANE_W, ROAD_COLOR);
      g.position.y = -0.55;
      group.add(g);
      // lane markings
      for(let i=-HALF;i<=HALF;i++){
        const dash = box(0.6,0.92,0.15,0xdedede);
        dash.position.set(i*LANE_W,-0.55,0);
        dash.castShadow=false;
        group.add(dash);
      }
      spawnVehicles(row, group);
    } else if(type==='water'){
      const g = box(COLS*LANE_W+LANE_W, 0.7, LANE_W, WATER_COLOR);
      g.position.y = -0.65;
      group.add(g);
      spawnLogs(row, group);
    }

    worldGroup.add(group);
    rows.push(row);
    rowGroups.set(index, group);
  }

  function vehicleColor(){
    const cols = [0xe45757,0xf2c14e,0x5aa9e6,0xffffff,0xff8a3d,0x9b7ede];
    return cols[Math.floor(Math.random()*cols.length)];
  }

  function spawnVehicles(row, group){
    const count = 2 + Math.floor(Math.random()*2);
    const spacing = (COLS*LANE_W)/count;
    for(let i=0;i<count;i++){
      const isTruck = Math.random()<0.25;
      const len = isTruck?2.6:1.6;
      const mesh = box(len,0.9,1.5, vehicleColor());
      mesh.position.y = 0.1;
      const startX = (-HALF*LANE_W) + i*spacing + Math.random()*spacing*0.4;
      mesh.position.x = startX;
      // cab detail
      const cab = box(0.7,0.4,1.5, 0xdff1ff);
      cab.position.set(len*0.28*row.dir*-1,0.55,0);
      mesh.add(cab);
      group.add(mesh);
      vehicles.push({mesh, group, row, speed: row.speed*(isTruck?0.8:1)*row.dir, halfLen: len/2});
    }
  }

  function spawnLogs(row, group){
    const count = 2 + Math.floor(Math.random()*2);
    const spacing = (COLS*LANE_W)/count;
    for(let i=0;i<count;i++){
      const len = 2 + Math.random()*1.6;
      const mesh = box(len,0.5,1.6, 0x9a6a3f);
      mesh.position.y = -0.28;
      const startX = (-HALF*LANE_W) + i*spacing + Math.random()*spacing*0.3;
      mesh.position.x = startX;
      group.add(mesh);
      vehicles.push({mesh, group, row, speed: row.speed*0.7*row.dir, halfLen: len/2, isLog:true});
    }
  }

  function clearRow(index){
    const group = rowGroups.get(index);
    if(group){ worldGroup.remove(group); }
    rowGroups.delete(index);
    vehicles = vehicles.filter(v=>v.row.index!==index);
    rows = rows.filter(r=>r.index!==index);
  }

  // ---------- player ----------
  const CHARACTERS = [
    {id:'chicken', name:'White Chicken'},
    {id:'dog', name:'Brown Dog'},
    {id:'robot', name:'Silver Robot'},
    {id:'alien', name:'Green Alien'}
  ];
  let charIdx = 0;
  const savedChar = localStorage.getItem('hopRushChar');
  if(savedChar) {
    const idx = CHARACTERS.findIndex(c=>c.id===savedChar);
    if(idx!==-1) charIdx = idx;
  }
  document.getElementById('char-name').textContent = CHARACTERS[charIdx].name;

  document.getElementById('prevChar').addEventListener('click', ()=>{
    charIdx = (charIdx - 1 + CHARACTERS.length) % CHARACTERS.length;
    document.getElementById('char-name').textContent = CHARACTERS[charIdx].name;
    localStorage.setItem('hopRushChar', CHARACTERS[charIdx].id);
    scene.remove(player); player = buildPlayer(); scene.add(player);
  });
  document.getElementById('nextChar').addEventListener('click', ()=>{
    charIdx = (charIdx + 1) % CHARACTERS.length;
    document.getElementById('char-name').textContent = CHARACTERS[charIdx].name;
    localStorage.setItem('hopRushChar', CHARACTERS[charIdx].id);
    scene.remove(player); player = buildPlayer(); scene.add(player);
  });

  function buildPlayer(){
    const char = CHARACTERS[charIdx].id;
    const g = new THREE.Group();
    
    if(char === 'chicken'){
      const body = box(0.8,0.6,0.8,0xffe08a);
      body.position.y = 0.4;
      const head = box(0.55,0.5,0.55,0xffffff);
      head.position.y = 0.95;
      const beak = box(0.22,0.18,0.3,0xff9a3d);
      beak.position.set(0,0.9,0.4);
      const comb = box(0.3,0.2,0.16,0xff5d5d);
      comb.position.set(0,1.28,0);
      g.add(body,head,beak,comb);
    } else if(char === 'dog'){
      const body = box(0.9,0.6,1.0,0x96643c);
      body.position.y = 0.4;
      const head = box(0.6,0.5,0.6,0x96643c);
      head.position.set(0,0.95,0.2);
      const earL = box(0.2,0.4,0.1,0x5a391e);
      earL.position.set(-0.35,0.9,0.2);
      const earR = box(0.2,0.4,0.1,0x5a391e);
      earR.position.set(0.35,0.9,0.2);
      const snout = box(0.3,0.2,0.2,0x28190f);
      snout.position.set(0,0.8,0.5);
      g.add(body,head,earL,earR,snout);
    } else if(char === 'robot'){
      const body = box(0.8,0.7,0.8,0x969696);
      body.position.y = 0.45;
      const head = box(0.7,0.5,0.7,0x969696);
      head.position.set(0,1.05,0);
      const ant = box(0.1,0.3,0.1,0x555555);
      ant.position.set(0,1.4,0);
      const light = box(0.2,0.2,0.2,0xff3c3c);
      light.position.set(0,1.5,0);
      g.add(body,head,ant,light);
    } else if(char === 'alien'){
      const body = box(0.7,0.5,0.7,0x00ff00);
      body.position.y = 0.35;
      const head = box(0.9,0.7,0.8,0x00ff00);
      head.position.set(0,0.95,0);
      const eye1 = box(0.3,0.3,0.1,0x222222);
      eye1.position.set(-0.25,1.0,0.45);
      const eye2 = box(0.3,0.3,0.1,0x222222);
      eye2.position.set(0.25,1.0,0.45);
      g.add(body,head,eye1,eye2);
    }

    const eyeMat = new THREE.MeshLambertMaterial({color:0x1b2a2f});
    const eyeL = new THREE.Mesh(new THREE.BoxGeometry(0.1,0.1,0.05), eyeMat);
    const eyeR = new THREE.Mesh(new THREE.BoxGeometry(0.1,0.1,0.05), eyeMat);
    if(char==='chicken'){
       eyeL.position.set(-0.16,1.0,0.28); eyeR.position.set(0.16,1.0,0.28);
       g.add(eyeL,eyeR);
    } else if(char==='dog'){
       eyeL.position.set(-0.2,1.05,0.45); eyeR.position.set(0.2,1.05,0.45);
       g.add(eyeL,eyeR);
    }

    g.traverse(o=>{if(o.isMesh){o.castShadow=true;}});
    return g;
  }


  player = buildPlayer();
  scene.add(player);

  // ---------- weather ----------
  const WEATHER_TYPES = [
    {id:'sunny', name:'Sunny'},
    {id:'rainy', name:'Rainy'},
    {id:'snowy', name:'Snowy'},
    {id:'foggy', name:'Foggy'}
  ];
  let weatherIdx = 0;
  let weatherTimer = 0;
  
  const particleGeo = new THREE.BoxGeometry(0.1, 0.4, 0.1);
  const particleMat = new THREE.MeshLambertMaterial({color:0xffffff, transparent:true, opacity:0.8});
  const particleGroup = new THREE.Group();
  scene.add(particleGroup);
  let particles = [];
  let toastTimeout = null;

  function setWeather(idx){
    weatherIdx = idx;
    const w = WEATHER_TYPES[idx];
    
    const toast = document.getElementById('toast');
    toast.textContent = 'Weather: ' + w.name;
    toast.classList.add('visible');
    if(toastTimeout) clearTimeout(toastTimeout);
    toastTimeout = setTimeout(()=>toast.classList.remove('visible'), 2500);
    
    while(particleGroup.children.length > 0){ particleGroup.remove(particleGroup.children[0]); }
    particles = [];
    
    if(w.id === 'sunny'){
      scene.fog.near = 30; scene.fog.far = 62;
      hemi.intensity = 0.9; sun.intensity = 0.9;
    } else if(w.id === 'rainy'){
      scene.fog.near = 20; scene.fog.far = 50;
      hemi.intensity = 0.6; sun.intensity = 0.5;
      particleMat.color.setHex(0x96c8ff);
      particleGeo.scale(1,1.5,1);
      for(let i=0;i<150;i++){
        const m = new THREE.Mesh(particleGeo, particleMat);
        m.position.set((Math.random()-0.5)*40, Math.random()*20, (Math.random()-0.5)*40);
        m.userData = {s: 15+Math.random()*10, t:'rain'};
        particleGroup.add(m);
        particles.push(m);
      }
      particleGeo.scale(1,1/1.5,1);
    } else if(w.id === 'snowy'){
      scene.fog.near = 15; scene.fog.far = 40;
      hemi.intensity = 0.7; sun.intensity = 0.6;
      particleMat.color.setHex(0xffffff);
      particleGeo.scale(2,0.5,2);
      for(let i=0;i<200;i++){
        const m = new THREE.Mesh(particleGeo, particleMat);
        m.position.set((Math.random()-0.5)*40, Math.random()*20, (Math.random()-0.5)*40);
        m.userData = {s: 3+Math.random()*4, sway:Math.random()*Math.PI*2, t:'snow'};
        particleGroup.add(m);
        particles.push(m);
      }
      particleGeo.scale(0.5,2,0.5);
    } else if(w.id === 'foggy'){
      scene.fog.near = 5; scene.fog.far = 20;
      hemi.intensity = 0.5; sun.intensity = 0.3;
    }
  }

  function updateWeather(dtSec){
    weatherTimer += dtSec;
    if(weatherTimer > 15){
      weatherTimer = 0;
      let nextIdx;
      do { nextIdx = Math.floor(Math.random()*4); } while(nextIdx === weatherIdx);
      setWeather(nextIdx);
    }
    
    const px = playerPos.x, pz = -playerZ*LANE_W;
    for(const m of particles){
      m.position.y -= m.userData.s * dtSec;
      if(m.userData.t === 'snow'){
         m.userData.sway += dtSec * 2;
         m.position.x += Math.sin(m.userData.sway)*dtSec*2;
      }
      
      if(m.position.y < -1){
        m.position.y = 15 + Math.random()*5;
        m.position.x = px + (Math.random()-0.5)*40;
        m.position.z = pz + (Math.random()-0.5)*40;
      }
      
      if(m.position.x > px + 20) m.position.x -= 40;
      if(m.position.x < px - 20) m.position.x += 40;
      if(m.position.z > pz + 20) m.position.z -= 40;
      if(m.position.z < pz - 20) m.position.z += 40;
    }
  }

  function resetGame(){
    // clear world
    for(const idx of Array.from(rowGroups.keys())) clearRow(idx);
    rows = []; vehicles = []; riverStreak=0;
    for(let i=0;i<=22;i++) makeRow(i);

    playerX = 0; playerZ = 0;
    playerPos.set(0,0.5,0);
    playerTarget.copy(playerPos);
    hopT = 1;
    facing = 0; targetFacing = 0;
    onLog = null;
    alive = true;
    score = 0;
    updateScoreHUD();
    player.position.copy(playerPos);
    player.rotation.y = facing;
  }

  function ensureRowsAhead(){
    let maxIdx = 0;
    for(const r of rows) maxIdx = Math.max(maxIdx, r.index);
    while(maxIdx < playerZ + 22){
      maxIdx++;
      makeRow(maxIdx);
    }
    // cull behind
    for(const r of rows.slice()){
      if(r.index < playerZ - 6) clearRow(r.index);
    }
  }

  function rowAt(z){ return rows.find(r=>r.index===z); }

  function tileBlocked(x,z){
    const row = rowAt(z);
    if(!row) return false;
    if(row.type==='grass' && row.occupied.has(Math.round(x))) return true;
    return false;
  }

  function tryMove(dx,dz){
    if(!alive) return;
    const nz = playerZ + dz;
    const nx = playerX + dx;
    if(Math.abs(nx) > HALF) return; // world edge
    if(nz < playerZ) { /* allow moving back but not before start */ if(nz<0) return; }
    if(tileBlocked(nx,nz)) return;

    hopFrom.copy(playerPos);
    // snap to grid when landing on solid ground so log-drift doesn't accumulate
    const landRow = rowAt(nz);
    playerX = (landRow && landRow.type!=='water') ? Math.round(nx) : nx;
    playerZ = nz;
    playerTarget.set(playerX*LANE_W, 0.5, -playerZ*LANE_W);
    hopT = 0;

    updateFacingFromDelta(dx,dz);

    if(playerZ > score){ score = playerZ; updateScoreHUD(); }
    ensureRowsAhead();
  }

  function updateFacingFromDelta(dx,dz){
    // world: forward (increasing playerZ) maps to -Z in three space
    const dirX = dx;
    const dirZ = -dz;
    if(dirX===0 && dirZ===0) return;
    targetFacing = Math.atan2(dirX, dirZ);
  }

  function updateScoreHUD(){
    document.getElementById('score').textContent = score;
    if(score>best){ best = score; localStorage.setItem('hopRushBest', String(best)); }
    document.getElementById('best').textContent = 'BEST ' + best;
  }

  function die(){
    if(!alive) return;
    alive = false;
    document.getElementById('lastScore').textContent = score;
    document.getElementById('bestScore').textContent = best;
    document.getElementById('overlay').classList.remove('hidden');
    document.getElementById('playBtn').textContent = 'PLAY AGAIN';
  }

  // ---------- input ----------
  const keyMap = {
    ArrowUp:[0,1], KeyW:[0,1],
    ArrowDown:[0,-1], KeyS:[0,-1],
    ArrowLeft:[-1,0], KeyA:[-1,0],
    ArrowRight:[1,0], KeyD:[1,0],
  };
  window.addEventListener('keydown', (e)=>{
    if(keyMap[e.code]){
      e.preventDefault();
      if(!started){ startGame(); }
      tryMove(keyMap[e.code][0], keyMap[e.code][1]);
    }
  });

  function bindHold(id,dx,dz){
    const el = document.getElementById(id);
    el.addEventListener('pointerdown', (e)=>{
      e.preventDefault();
      if(!started){ startGame(); }
      tryMove(dx,dz);
    });
  }
  bindHold('btn-up',0,1);
  bindHold('btn-down',0,-1);
  bindHold('btn-left',-1,0);
  bindHold('btn-right',1,0);

  // swipe controls
  let touchStart = null;
  const swipeZone = document.getElementById('swipe-zone');
  swipeZone.addEventListener('pointerdown', (e)=>{ touchStart = {x:e.clientX,y:e.clientY}; });
  swipeZone.addEventListener('pointerup', (e)=>{
    if(!touchStart) return;
    const dx = e.clientX - touchStart.x;
    const dy = e.clientY - touchStart.y;
    touchStart = null;
    const absX=Math.abs(dx), absY=Math.abs(dy);
    if(Math.max(absX,absY) < 24) return; // tap, ignore
    if(!started){ startGame(); }
    if(absX>absY){ tryMove(dx>0?1:-1,0); }
    else { tryMove(0, dy>0?-1:1); }
  });

  document.getElementById('playBtn').addEventListener('click', startGame);

  function startGame(){
    document.getElementById('overlay').classList.add('hidden');
    started = true;
    resetGame();
  }

  // ---------- main loop ----------
  let last = performance.now();
  function animate(now){
    requestAnimationFrame(animate);
    const dt = Math.min(now-last, 40); last = now;
    const dtScale = dt/16.67;
    const dtSec = dt/1000;
    
    updateWeather(dtSec);

    // move vehicles/logs
    for(const v of vehicles){
      v.mesh.position.x += v.speed*dtScale;
      const limit = HALF*LANE_W + 4;
      if(v.mesh.position.x > limit) v.mesh.position.x = -limit;
      if(v.mesh.position.x < -limit) v.mesh.position.x = limit;
    }

    if(started && alive){
      // hop animation
      if(hopT < 1){
        hopT = Math.min(1, hopT + dt/140);
        const t = hopT;
        playerPos.lerpVectors(hopFrom, playerTarget, t);
        playerPos.y = 0.5 + Math.sin(t*Math.PI)*0.6;
      } else {
        playerPos.copy(playerTarget);
      }
      // smooth facing
      let df = targetFacing - facing;
      while(df>Math.PI) df-=Math.PI*2;
      while(df<-Math.PI) df+=Math.PI*2;
      facing += df*0.25;

      player.position.copy(playerPos);
      player.rotation.y = facing;

      // collisions with vehicles on current row (only when settled-ish, use continuous check)
      const curRow = rowAt(playerZ);
      if(curRow){
        if(curRow.type==='road'){
          for(const v of vehicles){
            if(v.row.index!==playerZ) continue;
            const dx = Math.abs(v.mesh.position.x - playerPos.x);
            if(dx < (v.halfLen+0.35)){
              die();
            }
          }
        } else if(curRow.type==='water' && hopT>=1){
          // must be on a log
          let onAnyLog = false;
          for(const v of vehicles){
            if(!v.isLog || v.row.index!==playerZ) continue;
            const dx = Math.abs(v.mesh.position.x - playerPos.x);
            if(dx < v.halfLen){
              onAnyLog = true;
              playerPos.x += v.speed*dtScale;
              playerTarget.x = playerPos.x;
              playerX = playerPos.x/LANE_W;
            }
          }
          if(!onAnyLog){ die(); }
          else if(Math.abs(playerPos.x) > HALF*LANE_W+1){ die(); }
        }
      }

      // camera follow
      const camTargetPos = new THREE.Vector3(playerPos.x*0.4, 0, playerPos.z).add(CAM_OFFSET);
      camera.position.lerp(camTargetPos, 0.08);
      const lookTarget = new THREE.Vector3(playerPos.x*0.4, 0, playerPos.z);
      camera.lookAt(lookTarget);
    }

    renderer.render(scene, camera);
  }

  // initial idle world for background before play
  for(let i=0;i<=22;i++) makeRow(i);
  document.getElementById('bestScore').textContent = best;
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
